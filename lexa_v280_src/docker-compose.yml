services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: lexa
      POSTGRES_USER: lexa
      POSTGRES_PASSWORD: lexa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexa -d lexa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
