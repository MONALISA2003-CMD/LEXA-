name: LEXA ZIP Extractor

on:
  push:
    paths:
      - "**/*.zip"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lexa-zip-extractor
  cancel-in-progress: false

jobs:
  extract:
    name: Detect and extract LEXA ZIPs

    # Prevent the extractor's own commit from starting another extraction run.
    if: "!contains(github.event.head_commit.message, '[lexa-extractor]')"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect and extract LEXA ZIPs
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile
          import shutil

          ROOT = Path(".").resolve()

          # ------------------------------------------------------------
          # Find ZIP files anywhere in the repository.
          # ------------------------------------------------------------

          archives = []

          for path in ROOT.rglob("*.zip"):
              relative = path.relative_to(ROOT)

              if ".git" in relative.parts:
                  continue

              archives.append(path)

          archives = sorted(archives)

          print("=" * 70)
          print("LEXA ZIP DETECTOR")
          print("=" * 70)

          if not archives:
              print("No ZIP files found.")
              print("Nothing to extract.")
              raise SystemExit(0)

          print(f"Found {len(archives)} ZIP file(s):")

          for archive in archives:
              print(f"  - {archive.relative_to(ROOT)}")

          # ------------------------------------------------------------
          # Protected repository paths.
          #
          # LEXA application packages must NOT replace GitHub
          # automation.
          # ------------------------------------------------------------

          PROTECTED_PREFIXES = (
              Path(".github/workflows"),
          )

          PROTECTED_FILES = {
              Path(".github/dependabot.yml"),
          }

          def is_protected(path: Path) -> bool:
              path = Path(path)

              if path in PROTECTED_FILES:
                  return True

              for prefix in PROTECTED_PREFIXES:
                  try:
                      path.relative_to(prefix)
                      return True
                  except ValueError:
                      pass

              return False

          # ------------------------------------------------------------
          # Validate ZIP paths.
          # ------------------------------------------------------------

          def validate_path(name: str) -> Path:
              path = Path(name)

              if path.is_absolute():
                  raise RuntimeError(
                      f"Unsafe absolute path inside ZIP: {name}"
                  )

              if ".." in path.parts:
                  raise RuntimeError(
                      f"Unsafe path traversal inside ZIP: {name}"
                  )

              return path

          # ------------------------------------------------------------
          # Process every ZIP.
          # ------------------------------------------------------------

          for archive in archives:

              print("")
              print("=" * 70)
              print(
                  f"PROCESSING: "
                  f"{archive.relative_to(ROOT)}"
              )
              print("=" * 70)

              try:

                  with ZipFile(archive, "r") as zf:

                      names = zf.namelist()

                      # ------------------------------------------------
                      # Validate all paths before extraction.
                      # ------------------------------------------------

                      for name in names:
                          validate_path(name)

                      # ------------------------------------------------
                      # Find deletion manifests.
                      #
                      # Supported anywhere inside the package:
                      # DELETE.txt
                      # .lexa-delete
                      # ------------------------------------------------

                      manifests = []

                      for name in names:

                          if name.endswith("/"):
                              continue

                          path = Path(name)

                          if path.name in {
                              "DELETE.txt",
                              ".lexa-delete",
                          }:
                              manifests.append(name)

                      delete_entries = []

                      for manifest in manifests:

                          print(
                              f"Reading deletion manifest: "
                              f"{manifest}"
                          )

                          content = zf.read(manifest).decode(
                              "utf-8"
                          )

                          for line in content.splitlines():

                              line = line.strip()

                              if not line:
                                  continue

                              if line.startswith("#"):
                                  continue

                              delete_entries.append(line)

                      # ------------------------------------------------
                      # Extract package.
                      # ------------------------------------------------

                      for name in names:

                          if name.endswith("/"):
                              continue

                          safe_name = validate_path(name)

                          # Never extract deletion manifests.
                          if safe_name.name in {
                              "DELETE.txt",
                              ".lexa-delete",
                          }:
                              continue

                          # ------------------------------------------------
                          # IMPORTANT:
                          # Never allow a ZIP to overwrite GitHub
                          # Actions workflows.
                          # ------------------------------------------------

                          if is_protected(safe_name):

                              print(
                                  "WARNING: Skipping protected "
                                  f"path: {safe_name}"
                              )

                              continue

                          destination = ROOT / safe_name

                          destination.parent.mkdir(
                              parents=True,
                              exist_ok=True
                          )

                          print(
                              f"Extracting: "
                              f"{destination.relative_to(ROOT)}"
                          )

                          with zf.open(name, "r") as source:

                              with open(
                                  destination,
                                  "wb"
                              ) as target:

                                  shutil.copyfileobj(
                                      source,
                                      target
                                  )

              except BadZipFile:

                  raise RuntimeError(
                      f"Invalid ZIP archive: {archive}"
                  )

              # --------------------------------------------------------
              # Delete explicitly listed obsolete files.
              #
              # NEVER allow DELETE.txt to remove protected automation.
              # --------------------------------------------------------

              for entry in delete_entries:

                  target_path = validate_path(entry)

                  if is_protected(target_path):

                      print(
                          "WARNING: Refusing to delete protected "
                          f"path: {target_path}"
                      )

                      continue

                  target = ROOT / target_path

                  # Safety check.
                  try:
                      target.resolve().relative_to(ROOT)
                  except ValueError:

                      raise RuntimeError(
                          f"Deletion outside repository blocked: "
                          f"{entry}"
                      )

                  if not target.exists():

                      print(
                          f"Delete target not found, skipping: "
                          f"{entry}"
                      )

                      continue

                  if target.is_dir():

                      print(
                          f"Deleting obsolete directory: "
                          f"{entry}"
                      )

                      shutil.rmtree(target)

                  else:

                      print(
                          f"Deleting obsolete file: "
                          f"{entry}"
                      )

                      target.unlink()

              # --------------------------------------------------------
              # Remove the processed ZIP.
              # --------------------------------------------------------

              print(
                  f"Removing processed ZIP: "
                  f"{archive.relative_to(ROOT)}"
              )

              archive.unlink()

          print("")
          print("=" * 70)
          print("LEXA ZIP EXTRACTION COMPLETE")
          print("=" * 70)
          PY

      - name: Show repository changes
        shell: bash
        run: |
          echo "========================================"
          echo "REPOSITORY CHANGES"
          echo "========================================"

          git status --short

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "lexa-automation[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "chore: automatically extract LEXA ZIP package [lexa-extractor]"

          git push
