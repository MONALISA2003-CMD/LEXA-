name: LEXA ZIP Extractor

on:
  workflow_dispatch:
  push:
    paths:
      - "incoming/**/*.zip"
      - "incoming/*.zip"
      - ".github/workflows/lexa-zip-extract.yml"

permissions:
  contents: write

concurrency:
  group: lexa-zip-extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[lexa-extractor]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract all incoming LEXA ZIPs safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os

          incoming = Path("incoming")
          zips = sorted(incoming.rglob("*.zip")) if incoming.exists() else []
          if not zips:
              print("No ZIP files found in incoming/.")
              raise SystemExit(0)

          def safe_member(name: str) -> Path:
              p = Path(name)
              if p.is_absolute() or ".." in p.parts:
                  raise RuntimeError(f"Unsafe ZIP path: {name}")
              return p

          for archive in zips:
              print(f"Processing {archive}")
              delete_entries = []
              with ZipFile(archive) as zf:
                  names = zf.namelist()
                  for name in names:
                      safe_member(name)
                  for manifest_name in ("DELETE.txt", ".lexa-delete", f"{archive.stem}/DELETE.txt", f"{archive.stem}/.lexa-delete"):
                      if manifest_name in names:
                          raw = zf.read(manifest_name).decode("utf-8")
                          delete_entries.extend(
                              line.strip() for line in raw.splitlines()
                              if line.strip() and not line.lstrip().startswith("#")
                          )
                  for name in names:
                      target = Path(name)
                      # Do not extract deletion manifests into the repository.
                      if target.name in {"DELETE.txt", ".lexa-delete"}:
                          continue
                      target_path = Path(".") / target
                      target_path.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(name) as src, open(target_path, "wb") as dst:
                          dst.write(src.read())

              for entry in delete_entries:
                  target = safe_member(entry)
                  target_path = Path(".") / target
                  if target_path.is_file():
                      print(f"Deleting obsolete file: {target_path}")
                      target_path.unlink()
                  elif target_path.is_dir():
                      print(f"Deleting obsolete directory: {target_path}")
                      import shutil
                      shutil.rmtree(target_path)
                  else:
                      print(f"Delete target not present (skipped): {target_path}")

              archive.unlink()
              print(f"Removed processed ZIP: {archive}")
          PY

      - name: Check repository changes
        run: git status --short

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lexa-automation[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: extract LEXA package [lexa-extractor]"
          git push
          
