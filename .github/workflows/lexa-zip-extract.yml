name: LEXA ZIP Extractor

on:
  push:
    paths:
      - "**/*.zip"
  workflow_dispatch:

# Required for committing extracted source and explicitly dispatching the one
# canonical build/test workflow. No deployment permissions are granted.
permissions:
  contents: write
  actions: write

concurrency:
  group: lexa-zip-extractor
  cancel-in-progress: false

jobs:
  extract:
    name: Validate, extract and trigger canonical LEXA CI
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[lexa-extractor]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Require a branch ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "::error::The LEXA ZIP Extractor must run against a branch, not a tag or detached ref."
            exit 1
          fi

      - name: Validate, normalize and extract source packages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile, BadZipFile
          import shutil
          import stat

          ROOT = Path('.').resolve()
          PROTECTED_PREFIXES = (PurePosixPath('.github/workflows'),)
          PROTECTED_FILES = {PurePosixPath('.github/dependabot.yml')}
          MANIFEST_NAMES = {'DELETE.txt', '.lexa-delete'}
          REQUIRED_MARKERS = ('apps/web/package.json', 'apps/api/app/main.py')
          MAX_FILES_PER_ARCHIVE = 50000
          MAX_UNCOMPRESSED_BYTES = 1_500_000_000

          def validate(name: str) -> PurePosixPath:
              # Reject absolute/traversal paths, Windows-style separators and .git.
              # Archive entries are always treated as ordinary files, never symlinks.
              if not name or '\x00' in name or '\\' in name or name.startswith('/'):
                  raise RuntimeError(f'Unsafe path in ZIP: {name!r}')
              p = PurePosixPath(name.rstrip('/'))
              if not p.parts or p.is_absolute() or '..' in p.parts or '.git' in p.parts:
                  raise RuntimeError(f'Unsafe path in ZIP: {name!r}')
              return p

          def protected(path: PurePosixPath) -> bool:
              if path in PROTECTED_FILES:
                  return True
              return any(path == prefix or prefix in path.parents for prefix in PROTECTED_PREFIXES)

          def ensure_inside_root(path: Path) -> None:
              try:
                  path.resolve(strict=False).relative_to(ROOT)
              except ValueError as exc:
                  raise RuntimeError(f'Path resolves outside the repository: {path}') from exc

          def detect_wrapper(names: list[str]) -> str | None:
              # Accept a package at ZIP root or under one unambiguous wrapper.
              candidates = set()
              for name in names:
                  normalized = name.rstrip('/')
                  for marker in REQUIRED_MARKERS:
                      suffix = '/' + marker
                      if normalized == marker:
                          candidates.add('')
                      elif normalized.endswith(suffix):
                          candidates.add(normalized[:-len(suffix)])

              valid = []
              for prefix in candidates:
                  def has(path: str) -> bool:
                      key = f'{prefix}/{path}' if prefix else path
                      return key in names

                  migrations_path = f'{prefix}/migrations' if prefix else 'migrations'
                  migrations_prefix = migrations_path + '/'
                  has_migrations = any(
                      n == migrations_path or n.startswith(migrations_prefix)
                      for n in names
                  )
                  if all(has(marker) for marker in REQUIRED_MARKERS) and has_migrations:
                      valid.append(prefix)

              if len(valid) == 1:
                  return valid[0]
              if not valid:
                  return None
              raise RuntimeError(f'ZIP contains multiple possible LEXA source roots: {valid}')

          def strip_wrapper(path: PurePosixPath, wrapper_parts: tuple[str, ...]) -> PurePosixPath | None:
              if not wrapper_parts:
                  return path
              if path.parts[:len(wrapper_parts)] == wrapper_parts:
                  remaining = path.parts[len(wrapper_parts):]
                  return PurePosixPath(*remaining) if remaining else None
              # Manifest entries can intentionally be repository-relative without
              # including the ZIP wrapper, matching the previous extractor behavior.
              return path

          # Do not inspect ZIP files in .git or protected automation directories.
          archives = sorted(
              p for p in ROOT.rglob('*.zip')
              if '.git' not in p.relative_to(ROOT).parts
              and not protected(PurePosixPath(p.relative_to(ROOT).as_posix()))
          )
          if not archives:
              print('No ZIP packages found; nothing to do.')
              raise SystemExit(0)

          processed = 0
          for archive in archives:
              rel_archive = PurePosixPath(archive.relative_to(ROOT).as_posix())
              print(f'Inspecting {rel_archive}')
              delete_entries: list[str] = []
              archive_processed = False

              try:
                  with ZipFile(archive, 'r') as zf:
                      infos = zf.infolist()
                      if len(infos) > MAX_FILES_PER_ARCHIVE:
                          raise RuntimeError(f'{archive.name} has too many ZIP entries ({len(infos)}).')
                      total_bytes = sum(info.file_size for info in infos if not info.is_dir())
                      if total_bytes > MAX_UNCOMPRESSED_BYTES:
                          raise RuntimeError(f'{archive.name} exceeds the uncompressed size limit.')

                      for info in infos:
                          validate(info.filename)
                          unix_mode = info.external_attr >> 16
                          if stat.S_IFMT(unix_mode) == stat.S_IFLNK:
                              raise RuntimeError(f'Symbolic links are not allowed in ZIP packages: {info.filename}')

                      files = [info for info in infos if not info.is_dir()]
                      names = [info.filename for info in files]
                      wrapper = detect_wrapper(names)

                      # Leave unrelated ZIPs untouched; they are not LEXA source packages.
                      if wrapper is None:
                          print(f'Skipping ZIP without a recognizable LEXA source tree: {rel_archive}')
                          continue

                      wrapper_parts = PurePosixPath(wrapper).parts if wrapper else ()
                      archive_processed = True
                      processed += 1

                      # Read deletion manifests before extracting files.
                      for info in files:
                          if PurePosixPath(info.filename).name not in MANIFEST_NAMES:
                              continue
                          for line in zf.read(info).decode('utf-8').splitlines():
                              entry_text = line.strip()
                              if not entry_text or entry_text.startswith('#'):
                                  continue
                              entry = validate(entry_text)
                              entry = strip_wrapper(entry, wrapper_parts)
                              if entry is None:
                                  continue
                              delete_entries.append(entry.as_posix())

                      for info in files:
                          entry = validate(info.filename)
                          if entry.name in MANIFEST_NAMES:
                              continue
                          entry = strip_wrapper(entry, wrapper_parts)
                          if entry is None:
                              continue

                          if wrapper_parts and entry.parts == PurePosixPath(info.filename).parts:
                              # This file was alongside the detected wrapper rather
                              # than inside it; ignore adjacent archive documentation.
                              if PurePosixPath(info.filename).parts[:len(wrapper_parts)] != wrapper_parts:
                                  continue

                          if protected(entry):
                              print(f'Protected automation path skipped: {entry}')
                              continue

                          destination = ROOT.joinpath(*entry.parts)
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          ensure_inside_root(destination)
                          # Do not follow existing symlinks while writing extracted files.
                          current = destination
                          while current != ROOT and current != current.parent:
                              if current.is_symlink():
                                  raise RuntimeError(f'Refusing to write through a repository symlink: {current}')
                              current = current.parent

                          with zf.open(info, 'r') as source, destination.open('wb') as target:
                              shutil.copyfileobj(source, target)
                          print(f'Extracted canonical path: {entry}')

              except BadZipFile as exc:
                  raise RuntimeError(f'Invalid ZIP archive: {archive}') from exc

              # Apply explicit deletions only after validation and extraction succeeded.
              for entry_text in delete_entries:
                  entry = validate(entry_text)
                  if protected(entry):
                      print(f'Protected deletion blocked: {entry}')
                      continue
                  target = ROOT.joinpath(*entry.parts)
                  ensure_inside_root(target)
                  if not target.exists() and not target.is_symlink():
                      continue
                  if target.is_symlink():
                      target.unlink()
                  elif target.is_dir():
                      shutil.rmtree(target)
                  else:
                      target.unlink()
                  print(f'Removed obsolete path: {entry}')

              # Only remove a ZIP after it has been recognized and processed.
              if archive_processed:
                  archive.unlink(missing_ok=True)
                  print(f'Finished {rel_archive}')

          if processed == 0:
              print('No recognizable LEXA source ZIP packages were processed.')
          PY

      - name: Review and commit extracted files
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name "lexa-automation[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted source changes to commit."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: extract canonical LEXA source [lexa-extractor]"
          git push
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch the single canonical LEXA CI
        if: steps.commit.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Dispatching .github/workflows/lexa-ci.yml for ref ${GITHUB_REF_NAME}"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/lexa-ci.yml/dispatches" \
            --method POST \
            -f "ref=${GITHUB_REF_NAME}"
            
