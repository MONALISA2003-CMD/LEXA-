name: LEXA ZIP Extractor

on:
  push:
    paths:
      - "**/*.zip"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lexa-zip-extractor
  cancel-in-progress: false

jobs:
  extract:
    name: Detect and extract LEXA ZIPs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect and extract ZIP files
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile
          import shutil

          ROOT = Path(".").resolve()

          # Find ZIP files anywhere in the repository.
          # Ignore .git because GitHub Actions metadata is not package input.
          archives = []

          for path in ROOT.rglob("*.zip"):
              relative = path.relative_to(ROOT)

              if ".git" in relative.parts:
                  continue

              archives.append(path)

          archives = sorted(archives)

          print("=" * 70)
          print("LEXA ZIP DETECTION")
          print("=" * 70)

          if not archives:
              print("No ZIP files found.")
              print("Nothing to extract.")
              raise SystemExit(0)

          print(f"Found {len(archives)} ZIP file(s):")

          for archive in archives:
              print(f"  - {archive.relative_to(ROOT)}")

          def validate_path(name: str):
              path = Path(name)

              if path.is_absolute():
                  raise RuntimeError(
                      f"Unsafe absolute path inside ZIP: {name}"
                  )

              if ".." in path.parts:
                  raise RuntimeError(
                      f"Unsafe path traversal inside ZIP: {name}"
                  )

              return path

          for archive in archives:

              print("")
              print("=" * 70)
              print(
                  f"PROCESSING: "
                  f"{archive.relative_to(ROOT)}"
              )
              print("=" * 70)

              try:
                  with ZipFile(archive, "r") as zf:

                      names = zf.namelist()

                      # ------------------------------------------------
                      # Validate ALL ZIP paths before extraction.
                      # ------------------------------------------------

                      for name in names:
                          validate_path(name)

                      # ------------------------------------------------
                      # Find optional deletion manifests.
                      # ------------------------------------------------

                      manifests = []

                      for name in names:
                          normalized = name.rstrip("/")

                          if normalized in {
                              "DELETE.txt",
                              ".lexa-delete",
                          }:
                              manifests.append(name)

                          elif Path(normalized).name in {
                              "DELETE.txt",
                              ".lexa-delete",
                          }:
                              manifests.append(name)

                      delete_entries = []

                      for manifest in manifests:

                          print(
                              f"Reading deletion manifest: "
                              f"{manifest}"
                          )

                          content = zf.read(manifest).decode(
                              "utf-8"
                          )

                          for line in content.splitlines():

                              line = line.strip()

                              if not line:
                                  continue

                              if line.startswith("#"):
                                  continue

                              delete_entries.append(line)

                      # ------------------------------------------------
                      # Extract package.
                      # ------------------------------------------------

                      for name in names:

                          if name.endswith("/"):
                              continue

                          safe_name = validate_path(name)

                          # Never extract deletion manifests.
                          if safe_name.name in {
                              "DELETE.txt",
                              ".lexa-delete",
                          }:
                              continue

                          destination = ROOT / safe_name

                          destination.parent.mkdir(
                              parents=True,
                              exist_ok=True
                          )

                          print(
                              f"Extracting: "
                              f"{destination.relative_to(ROOT)}"
                          )

                          with zf.open(name, "r") as source:
                              with open(destination, "wb") as target:
                                  shutil.copyfileobj(
                                      source,
                                      target
                                  )

              except BadZipFile:
                  raise RuntimeError(
                      f"Invalid ZIP archive: {archive}"
                  )

              # --------------------------------------------------------
              # Delete ONLY paths explicitly listed in DELETE.txt.
              # --------------------------------------------------------

              for entry in delete_entries:

                  target_path = validate_path(entry)
                  target = ROOT / target_path

                  if not target.exists():
                      print(
                          f"Delete target does not exist, "
                          f"skipping: {entry}"
                      )
                      continue

                  # Safety check: never allow deletion outside repo.
                  try:
                      target.resolve().relative_to(ROOT)
                  except ValueError:
                      raise RuntimeError(
                          f"Deletion outside repository blocked: "
                          f"{entry}"
                      )

                  if target.is_dir():
                      print(
                          f"Deleting directory: "
                          f"{entry}"
                      )
                      shutil.rmtree(target)

                  else:
                      print(
                          f"Deleting file: "
                          f"{entry}"
                      )
                      target.unlink()

              # --------------------------------------------------------
              # Remove the processed ZIP.
              # --------------------------------------------------------

              print(
                  f"Removing processed ZIP: "
                  f"{archive.relative_to(ROOT)}"
              )

              archive.unlink()

          print("")
          print("=" * 70)
          print("LEXA ZIP EXTRACTION COMPLETE")
          print("=" * 70)
          PY

      - name: Show changes
        shell: bash
        run: |
          echo "Repository changes:"
          git status --short

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "lexa-automation[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "chore: automatically extract LEXA ZIP package [lexa-extractor]"

          git push
