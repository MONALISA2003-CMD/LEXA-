name: LEXA Model Registry and AI Router Build

on:
  workflow_dispatch:
    inputs:
      confirm_main_update:
        description: "Apply reviewed model registry, policy and CI fixes to main after all checks pass"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: lexa-ai-router-main
  cancel-in-progress: false

jobs:
  model-registry-and-policy:
    name: Apply model registry, policy integration and run full CI
    if: github.ref == 'refs/heads/main' && inputs.confirm_main_update == true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://lexa:lexa@localhost:5432/lexa
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: local-ci-only-secret-at-least-32-characters-long
      DATABASE_APP_ROLE: ''
      DATABASE_LOGIN_ROLE: lexa
      PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Check out current main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Apply central model registry and policy gate
        run: python scripts/lexa_apply_ai_router.py --apply

      - name: Validate Python syntax
        working-directory: apps/api
        run: python -m compileall -q app

      - name: Install API test dependencies
        working-directory: apps/api
        run: python -m pip install -e '.[dev]'

      - name: Run API and mock-only AI tests
        working-directory: apps/api
        run: python -m pytest tests -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Typecheck frontend
        working-directory: apps/web
        run: npm run typecheck

      - name: Run all frontend contracts
        working-directory: apps/web
        run: npm test

      - name: Build production frontend
        working-directory: apps/web
        run: npm run build

      - name: Validate Compose and HAProxy
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --quiet
          test -s deploy/docker/haproxy.cfg
          grep -Fq 'balance roundrobin' deploy/docker/haproxy.cfg
          grep -Fq 'balance leastconn' deploy/docker/haproxy.cfg
          docker run --rm \
            --volume "$PWD/deploy/docker/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" \
            haproxy:3.2-alpine haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit only after every check passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .env.example docker-compose.yml \
            apps/api/app/config.py \
            apps/api/app/intelligence/__init__.py \
            apps/api/app/intelligence/contracts.py \
            apps/api/app/intelligence/model_registry.py \
            apps/api/app/intelligence/policy.py \
            apps/api/app/routes/ai_assistant.py \
            apps/api/tests/test_intelligence_model_registry.py \
            apps/api/tests/test_intelligence_phase3.py \
            apps/web/tests/phase1-ux-contract.test.mjs \
            apps/web/tests/phase3-document-intelligence.test.mjs \
            apps/web/tests/phase4-demand-forecast.test.mjs \
            apps/web/tests/phase8-foundation-polish.test.mjs \
            apps/web/tests/visible-product-contract.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit; all requested changes already exist."
            exit 0
          fi
          git commit -m "feat: add policy-gated LEXA model registry"
          git push origin HEAD:main
