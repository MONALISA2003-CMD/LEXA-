name: Replace repository from verified source archive

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch whose current tree will be replaced
        required: true
        default: main
        type: string
      archive_url:
        description: HTTPS GitHub Release asset URL for LEXA_CLEAN_PROJECT.zip
        required: true
        type: string
      archive_sha256:
        description: SHA-256 checksum of the exact archive
        required: true
        type: string
      expected_head_sha:
        description: Exact 40-character current commit SHA of the target branch
        required: true
        type: string
      confirmation:
        description: Type the exact value to allow the full-tree replacement
        required: true
        default: NO
        type: choice
        options:
          - NO
          - REPLACE_ALL_FILES
      write_mode:
        description: Create a reviewable pull request (recommended) or push directly if policy permits
        required: true
        default: pull_request
        type: choice
        options:
          - pull_request
          - direct

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lexa-source-replacement-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  replace:
    name: Validate and replace the complete repository tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate explicit destructive-operation confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          ARCHIVE_URL: ${{ inputs.archive_url }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "REPLACE_ALL_FILES" ]] || { echo 'Refusing replacement: confirmation was not REPLACE_ALL_FILES.' >&2; exit 1; }
          [[ -n "$TARGET_BRANCH" ]] || { echo 'Target branch is required.' >&2; exit 1; }
          [[ "$ARCHIVE_URL" == https://github.com/* ]] || { echo 'Archive URL must be an HTTPS GitHub Release asset URL.' >&2; exit 1; }
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || { echo 'Invalid SHA-256 checksum.' >&2; exit 1; }
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Expected head must be a full 40-character SHA.' >&2; exit 1; }

      - name: Checkout the exact target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Confirm target branch has not changed
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git branch --show-current)" == "$TARGET_BRANCH" ]] || { echo 'Checkout branch does not match target branch.' >&2; exit 1; }
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$EXPECTED_HEAD_SHA" ]] || { echo "Branch head changed: expected $EXPECTED_HEAD_SHA, found $actual" >&2; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo 'Checkout is unexpectedly dirty.' >&2; exit 1; }

      - name: Download source archive and verify checksum
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lexa-clean-source.zip"
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/octet-stream' \
            "$ARCHIVE_URL" -o "$archive"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$archive" | sha256sum --check --status || {
            echo 'Archive SHA-256 verification failed; refusing replacement.' >&2
            exit 1
          }
          echo "Verified clean source archive ($ARCHIVE_SHA256)."

      - name: Preserve pre-replacement source snapshot
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: git archive --format=zip --output="$RUNNER_TEMP/lexa-before-replacement.zip" "$EXPECTED_HEAD_SHA"

      - name: Upload pre-replacement backup
        uses: actions/upload-artifact@v4
        with:
          name: lexa-source-before-replacement-${{ inputs.expected_head_sha }}
          path: ${{ runner.temp }}/lexa-before-replacement.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create replacement branch when using pull-request mode
        if: ${{ inputs.write_mode == 'pull_request' }}
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: git switch -c "automation/clean-source-replacement-${GITHUB_RUN_ID}"

      - name: Replace all repository files from the verified archive
        env:
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          python scripts/replace_from_archive.py \
            --archive "$RUNNER_TEMP/lexa-clean-source.zip" \
            --sha256 "$ARCHIVE_SHA256" \
            --expected-head "$EXPECTED_HEAD_SHA" \
            --repo-root "$GITHUB_WORKSPACE" \
            --apply

      - name: Review resulting tree and create commit
        env:
          WRITE_MODE: ${{ inputs.write_mode }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --quiet && { echo 'No replacement changes were produced.'; exit 1; }
          git commit -m 'chore: replace repository with verified clean source'
          if [[ "$WRITE_MODE" == "direct" ]]; then
            git fetch origin "$TARGET_BRANCH"
            remote_head="$(git rev-parse FETCH_HEAD)"
            [[ "$remote_head" == "$EXPECTED_HEAD_SHA" ]] || { echo 'Target branch moved during replacement; refusing push.' >&2; exit 1; }
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          else
            git push --set-upstream origin "$(git branch --show-current)"
            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$(git branch --show-current)" \
              --title 'chore: clean and normalize LEXA repository' \
              --body "Full repository tree replacement from a SHA-256-verified source archive. Base commit: $EXPECTED_HEAD_SHA. A pre-replacement ZIP backup is attached to the workflow run. Review the complete diff and run CI before merging."
          fi
