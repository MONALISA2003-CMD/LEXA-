name: LEXA Full Business Language Audit

on:
  workflow_dispatch:
    inputs:
      confirm_main_update:
        description: "Apply the reviewed wording updates to main after all checks pass"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: lexa-business-language-main
  cancel-in-progress: false

jobs:
  audit-test-and-apply:
    name: Review all business screens and run full checks
    if: github.ref == 'refs/heads/main' && inputs.confirm_main_update == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://lexa:lexa@localhost:5432/lexa
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: local-ci-only-secret-at-least-32-characters-long
      DATABASE_APP_ROLE: ''
      DATABASE_LOGIN_ROLE: lexa
      PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Get the current main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Add the language regression checks for this run
        run: cp docs/LEXA_BUSINESS_LANGUAGE_AUDIT_TEST.mjs apps/web/tests/lexa-business-language-audit.test.mjs

      - name: Apply the approved business-language wording
        run: python scripts/lexa_apply_business_language.py --apply

      - name: Check the changes for formatting mistakes
        run: git diff --check

      - name: Install frontend packages
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Check frontend types
        working-directory: apps/web
        run: npm run typecheck

      - name: Run all frontend checks
        working-directory: apps/web
        run: npm test

      - name: Build the full frontend
        working-directory: apps/web
        run: npm run build

      - name: Install API and test packages
        working-directory: apps/api
        run: python -m pip install -e '.[dev]'

      - name: Run all API checks
        working-directory: apps/api
        run: python -m pytest tests -q

      - name: Check deployment configuration
        run: docker compose config --quiet

      - name: Check load-balancer configuration
        shell: bash
        run: |
          set -euo pipefail
          test -s deploy/docker/haproxy.cfg
          grep -Fq 'balance roundrobin' deploy/docker/haproxy.cfg
          grep -Fq 'balance leastconn' deploy/docker/haproxy.cfg
          grep -Fq 'server web1 web:3000 check' deploy/docker/haproxy.cfg
          grep -Fq 'server web2 web-2:3000 check' deploy/docker/haproxy.cfg
          grep -Fq 'server api1 api:8000 check' deploy/docker/haproxy.cfg
          grep -Fq 'server api2 api-2:8000 check' deploy/docker/haproxy.cfg
          docker run --rm --volume "$PWD/deploy/docker/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" haproxy:3.2-alpine haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg

      - name: Save the wording updates only after every check passes
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lexa-language-audit[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app apps/web/components apps/web/lib apps/web/tests apps/api/tests/test_intelligence_phase3.py docs/LEXA_PRODUCT_LANGUAGE_INVENTORY_2026-10-24.md
          if git diff --cached --quiet; then
            echo "No wording changes were needed; no commit created."
            exit 0
          fi
          git commit -m "Improve business language across LEXA screens"
          git push origin HEAD:main

      - name: Start the standard main-branch CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run lexa-ci.yml --ref main
