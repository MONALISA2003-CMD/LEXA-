name: LEXA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_clean_replay:
        description: 'Run the isolated disposable PostgreSQL migration replay'
        type: boolean
        required: true
        default: true
      run_phase7_staging_e2e:
        description: 'Run write-enabled Phase 7 acceptance only against configured disposable staging'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: lexa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-contracts:
    name: Backend contracts and permanent migration dispositions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      DATABASE_URL: postgresql://test:test@127.0.0.1/lexa_test
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: test-only-ci-secret-that-is-long-enough-for-contracts
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install all API test dependencies
        working-directory: apps/api
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run complete canonical Python suites (required integration tests may not skip)
        run: python -m pytest -q tests apps/api/tests
      - name: Compile backend and test scripts
        run: python -m compileall -q apps/api/app apps/api/tests scripts
      - name: Validate reconstructed replacement hashes and permanent dispositions
        run: python scripts/check_migration_recovery_manifest.py
      - name: Strict historical source reconciliation (approved replacements are valid dispositions)
        run: python scripts/check_migration_sources.py --strict
      - name: Verify clean-replay input bundle before opening a database
        run: python scripts/run_clean_migration_replay.py --plan-only

  frontend-contracts:
    name: Frontend Node 24 typecheck, contracts and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v7.1.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Clean dependency install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: All frontend contract tests
        working-directory: apps/web
        run: node --test tests/*.test.mjs
      - name: AST audit for button handlers, form submit handlers and link destinations
        run: node scripts/audit_frontend_actions.mjs
      - name: Production build
        working-directory: apps/web
        run: npm run build

  clean-database-replay:
    name: Clean SQL replay, RLS/privilege assertions and immutable evidence
    if: github.event_name != 'workflow_dispatch' || inputs.run_clean_replay == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lexa_replay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lexa_replay_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lexa_replay_ci
      LEXA_ALLOW_DISPOSABLE_REPLAY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python v7.0.0
        with:
          python-version: '3.13'
      - name: Install PostgreSQL client and psycopg
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          python -m pip install --upgrade pip 'psycopg[binary]>=3.2,<4'
      - name: Verify replay inputs and migration bundle SHA
        run: python scripts/run_clean_migration_replay.py --plan-only
      - name: Apply clean replay to a guarded empty disposable database
        run: python scripts/run_clean_migration_replay.py --apply
      - name: Verify evidence is from this commit and current SQL hashes
        run: python scripts/check_phase6_replay_evidence.py --evidence artifacts/phase6-replay-evidence.json --expected-commit "$GITHUB_SHA"
      - name: Mark semantic replacement gate passed only with same-commit replay evidence
        run: python scripts/check_migration_sources.py --strict --require-semantic-validation --evidence artifacts/phase6-replay-evidence.json
      - name: Retain clean-replay evidence and checksum
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4.6.2
        with:
          name: lexa-phase7-clean-replay-${{ github.sha }}
          path: |
            artifacts/phase6-replay-evidence.json
            artifacts/phase6-replay-evidence.json.sha256
          if-no-files-found: warn
          retention-days: 90

  phase7-staging-e2e:
    name: Phase 7 authenticated purchasing E2E (explicit disposable staging only)
    if: github.event_name == 'workflow_dispatch' && inputs.run_phase7_staging_e2e == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      LEXA_BROWSER_BASE_URL: ${{ vars.LEXA_PHASE7_STAGING_URL }}
      LEXA_PHASE7_STAGING_HOSTS: ${{ vars.LEXA_PHASE7_STAGING_HOSTS }}
      LEXA_PHASE7_ACCEPTANCE_FIXTURE_JSON: ${{ secrets.LEXA_PHASE7_ACCEPTANCE_FIXTURE_JSON }}
      LEXA_PHASE7_STORAGE_STATE_B64: ${{ secrets.LEXA_PHASE7_STORAGE_STATE_B64 }}
      LEXA_PHASE7_ALLOW_STAGING_WRITES: '1'
      LEXA_PHASE7_STORAGE_STATE: .phase7-storage-state.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v7.1.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Validate staging URL, host allow-list, disposable fixture and auth state
        env:
          FIXTURE_JSON: ${{ secrets.LEXA_PHASE7_ACCEPTANCE_FIXTURE_JSON }}
          STORAGE_B64: ${{ secrets.LEXA_PHASE7_STORAGE_STATE_B64 }}
          BASE_URL: ${{ vars.LEXA_PHASE7_STAGING_URL }}
          STAGING_HOSTS: ${{ vars.LEXA_PHASE7_STAGING_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$BASE_URL" || { echo 'Missing repository variable LEXA_PHASE7_STAGING_URL' >&2; exit 1; }
          test -n "$STAGING_HOSTS" || { echo 'Missing repository variable LEXA_PHASE7_STAGING_HOSTS' >&2; exit 1; }
          test -n "$FIXTURE_JSON" || { echo 'Missing secret LEXA_PHASE7_ACCEPTANCE_FIXTURE_JSON' >&2; exit 1; }
          test -n "$STORAGE_B64" || { echo 'Missing secret LEXA_PHASE7_STORAGE_STATE_B64' >&2; exit 1; }
          node - <<'NODE'
          const base = new URL(process.env.BASE_URL);
          const allow = process.env.STAGING_HOSTS.split(',').map(x => x.trim().toLowerCase()).filter(Boolean);
          const knownProduction = new Set(['lexa-green.vercel.app','lexa-n10e.onrender.com']);
          const fixture = JSON.parse(process.env.FIXTURE_JSON);
          if (base.protocol !== 'https:') throw new Error('Staging URL must use HTTPS');
          if (!allow.includes(base.hostname.toLowerCase())) throw new Error('Staging URL hostname is not in the explicit allow-list');
          if (knownProduction.has(base.hostname.toLowerCase())) throw new Error('Known production hostname is forbidden for write-enabled E2E');
          if (fixture.environment !== 'staging' || fixture.disposable_scope !== true || fixture.reset_strategy !== 'dispose_test_tenant') throw new Error('Fixture must declare staging, disposable_scope=true, reset_strategy=dispose_test_tenant');
          if (!['owner','administrator','manager','finance'].includes(fixture.actor_role)) throw new Error('Fixture actor_role is not eligible for Phase 7 lifecycle acceptance');
          for (const k of ['branch_id','location_id','variant_id','currency_code','unit_cost','order_quantity','receipt_quantity','landed_cost_amount']) if (fixture[k] === undefined || fixture[k] === null || fixture[k] === '') throw new Error(`Fixture missing ${k}`);
          NODE
          printf '%s' "$STORAGE_B64" | base64 --decode > apps/web/.phase7-storage-state.json
          node -e "JSON.parse(require('fs').readFileSync('apps/web/.phase7-storage-state.json','utf8'))"
      - name: Install Chromium browser dependencies
        run: npx --yes playwright@1.64.1 install --with-deps chromium
      - name: Run guarded authenticated Phase 7 lifecycle acceptance
        working-directory: apps/web
        run: npm run test:e2e:phase7
      - name: Remove authenticated storage state
        if: always()
        run: rm -f apps/web/.phase7-storage-state.json
      - name: Retain Phase 7 E2E report (never include auth state)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4.6.2
        with:
          name: lexa-phase7-staging-e2e-${{ github.sha }}
          path: apps/web/test-results/phase7/
          if-no-files-found: warn
          retention-days: 14

  ci-gate-evidence:
    name: Per-commit Phase 7 CI gate evidence (not production release acceptance)
    if: always()
    needs: [backend-contracts, frontend-contracts, clean-database-replay]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKEND_RESULT: ${{ needs.backend-contracts.result }}
      FRONTEND_RESULT: ${{ needs.frontend-contracts.result }}
      REPLAY_RESULT: ${{ needs.clean-database-replay.result }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python v7.0.0
        with:
          python-version: '3.13'
      - name: Generate exact-SHA CI summary (fail closed)
        run: python scripts/generate_phase6_ci_gate_evidence.py --output artifacts/phase7-ci-gate-evidence.json
      - name: Retain CI gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact v4.6.2
        with:
          name: lexa-phase7-ci-gate-${{ github.sha }}
          path: |
            artifacts/phase7-ci-gate-evidence.json
            artifacts/phase7-ci-gate-evidence.json.sha256
          if-no-files-found: warn
          retention-days: 90
