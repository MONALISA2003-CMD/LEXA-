global
  log stdout format raw local0 info
  maxconn 2048

defaults
  log global
  mode http
  option httplog
  option dontlognull
  timeout http-request 10s
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  retries 2
  option redispatch

resolvers docker_dns
  nameserver docker 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s

# Only the web frontend is published to the host. The API listener is private
# to the Compose network and serves Next.js server-side proxy requests.
frontend lexa_web_frontend
  bind :80
  default_backend lexa_web_nodes

backend lexa_web_nodes
  balance roundrobin
  option httpchk GET /
  http-check expect status 200
  server web1 web:3000 check inter 5s fall 3 rise 2 resolvers docker_dns resolve-prefer ipv4 init-addr libc,none
  server web2 web-2:3000 check inter 5s fall 3 rise 2 resolvers docker_dns resolve-prefer ipv4 init-addr libc,none

frontend lexa_api_frontend
  bind :8000
  default_backend lexa_api_nodes

backend lexa_api_nodes
  balance leastconn
  option httpchk GET /health
  http-check expect status 200
  server api1 api:8000 check inter 5s fall 3 rise 2 resolvers docker_dns resolve-prefer ipv4 init-addr libc,none
  server api2 api-2:8000 check inter 5s fall 3 rise 2 resolvers docker_dns resolve-prefer ipv4 init-addr libc,none
