apiVersion: v1
kind: ConfigMap
metadata:
  name: lexa-runtime-config
  namespace: lexa-system
data:
  APP_ENV: "production"
  PORT: "8000"
  JWT_ISSUER: "lexa"
  JWT_AUDIENCE: "lexa-web"
  DATABASE_APP_ROLE: "lexa_app"
  DATABASE_LOGIN_ROLE: "lexa_runtime_login_p3"
  PUBLIC_APP_URL: "https://lexa-green.vercel.app"
  CORS_ORIGINS: "https://lexa-green.vercel.app"
  ANALYTICS_REFRESH_WORKER_ENABLED: "false"
  ANALYTICS_WORKER_POLL_SECONDS: "10"
  ANALYTICS_WORKER_BATCH_SIZE: "20"
  LEXA_SLOW_REQUEST_MS: "500"
  DATABASE_POOL_SIZE: "2"
  DATABASE_MAX_OVERFLOW: "1"
  DATABASE_POOL_TIMEOUT_SECONDS: "5"
