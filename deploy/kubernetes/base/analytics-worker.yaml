apiVersion: apps/v1
kind: Deployment
metadata:
  name: lexa-analytics-worker
  namespace: lexa-system
  labels:
    app.kubernetes.io/name: lexa-analytics-worker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lexa-analytics-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lexa-analytics-worker
        app.kubernetes.io/part-of: lexa
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: analytics-worker
          image: ghcr.io/monalisa2003-cmd/lexa-api:REPLACE_WITH_RELEASE_TAG
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.analytics_outbox"]
          envFrom:
            - configMapRef:
                name: lexa-runtime-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lexa-api-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: lexa-api-secrets
                  key: redis-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lexa-api-secrets
                  key: jwt-secret
            - name: LEXA_PROXY_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: lexa-api-secrets
                  key: lexa-proxy-shared-secret
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
